<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- TOP BAR -->
  <header class="topbar">
    <div class="topbar__brand">
      <span class="topbar__logo">📋</span>
      <span class="topbar__title">Life Dashboard</span>
    </div>
    <div class="topbar__controls">
      <button id="themeToggle" class="btn-icon" title="Toggle tema" aria-label="Toggle tema">
        <span id="themeIcon">🌙</span>
      </button>
    </div>
  </header>

  <main class="layout">

    <!-- ===== KOLOM KIRI ===== -->
    <aside class="col-left">

      <!-- GREETING CARD -->
      <section class="card greeting-card">
        <div class="greeting__top">
          <div>
            <p id="greetTime" class="greeting__time">--:--:--</p>
            <p id="greetDate" class="greeting__date">-</p>
          </div>
          <button id="editNameBtn" class="btn-icon btn-icon--sm" title="Ganti nama" aria-label="Ganti nama">✏️</button>
        </div>
        <h1 id="greetMsg" class="greeting__msg">Selamat datang! 👋</h1>

        <!-- Form ganti nama (tersembunyi secara default) -->
        <div id="nameForm" class="name-form hidden">
          <input id="nameInput" type="text" class="input" placeholder="Masukkan namamu..." maxlength="30" />
          <div class="name-form__actions">
            <button id="saveNameBtn" class="btn btn--primary btn--sm">Simpan</button>
            <button id="cancelNameBtn" class="btn btn--ghost btn--sm">Batal</button>
          </div>
        </div>
      </section>

      <!-- FOCUS TIMER CARD -->
      <section class="card timer-card">
        <h2 class="card__title">⏱ Focus Timer</h2>
        <div class="timer__display" id="timerDisplay">25:00</div>
        <div class="timer__controls">
          <button id="timerStart" class="btn btn--primary">▶ Mulai</button>
          <button id="timerStop" class="btn btn--warning">⏸ Berhenti</button>
          <button id="timerReset" class="btn btn--ghost">↺ Ulang</button>
        </div>
        <div class="timer__progress-wrap">
          <div class="timer__progress-bar" id="timerProgress"></div>
        </div>
        <p class="timer__label" id="timerLabel">Siap memulai sesi fokus!</p>
      </section>

    </aside>

    <!-- ===== KOLOM KANAN ===== -->
    <div class="col-right">

      <!-- TO-DO LIST CARD -->
      <section class="card todo-card">
        <h2 class="card__title">✅ Daftar Tugas</h2>

        <div class="todo-add">
          <input id="todoInput" type="text" class="input" placeholder="Tambah tugas baru..." maxlength="100" />
          <button id="todoAddBtn" class="btn btn--primary">Tambah</button>
        </div>
        <p id="todoError" class="error-msg hidden"></p>

        <div class="todo-filter">
          <button class="btn-filter active" data-filter="all">Semua</button>
          <button class="btn-filter" data-filter="active">Aktif</button>
          <button class="btn-filter" data-filter="done">Selesai</button>
        </div>

        <ul id="todoList" class="todo-list">
          <!-- Diisi oleh JS -->
        </ul>

        <div class="todo-footer">
          <span id="todoCount" class="todo-count">0 tugas tersisa</span>
          <button id="clearDoneBtn" class="btn btn--ghost btn--sm">Hapus Selesai</button>
        </div>
      </section>

      <!-- QUICK LINKS CARD -->
      <section class="card links-card">
        <h2 class="card__title">🔗 Tautan Cepat</h2>

        <div class="links-add">
          <input id="linkName" type="text" class="input" placeholder="Nama (mis. YouTube)" maxlength="30" />
          <input id="linkUrl" type="url" class="input" placeholder="URL (mis. https://youtube.com)" maxlength="200" />
          <button id="linkAddBtn" class="btn btn--primary">Tambah</button>
        </div>
        <p id="linkError" class="error-msg hidden"></p>

        <div id="linkGrid" class="link-grid">
          <!-- Diisi oleh JS -->
        </div>
      </section>

    </div>
  </main>

  <!-- MODAL EDIT TUGAS -->
  <div id="editModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
    <div class="modal__box">
      <h3 id="editModalTitle" class="modal__title">Edit Tugas</h3>
      <input id="editTodoInput" type="text" class="input" maxlength="100" />
      <p id="editError" class="error-msg hidden"></p>
      <div class="modal__actions">
        <button id="editSaveBtn" class="btn btn--primary">Simpan</button>
        <button id="editCancelBtn" class="btn btn--ghost">Batal</button>
      </div>
    </div>
  </div>
  <div id="modalOverlay" class="modal-overlay hidden"></div>

  <script src="js/app.js"></script>
</body>
</html>
